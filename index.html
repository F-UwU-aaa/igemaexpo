<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igema · Cuadernos de campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:wght@900&display=swap">
<link rel="stylesheet" href="/assets/gallery.css">
<style>
  .campos{column-count:2;column-gap:28px}
  @media(min-width:700px){.campos{column-count:3}}
  .campo{display:block;text-decoration:none;color:inherit}
  .campo figcaption{font-size:30px}
</style>
</head>
<body>

<div class="r">
  <h1>Igema</h1>
  <br><br>
  <p class="sub">Elige un área que desea Ver</p>
  <main class="campos" id="campos"></main>
</div>

<script src="/assets/gallery.js"></script>
<script>
/* ============================================================
   LISTA DE ÁREAS
   Para agregar una nueva:
     1. Crea una carpeta /nombre-area/index.html (copia alguna de
        las que ya existen, como /recreacion, y cambia el título).
     2. Crea /fotos-nombre-area/ en la raíz y sube las fotos ahí
        (con cualquier nombre: corré renombrar_fotos.py después).
     3. Agrega una línea aquí abajo: [título, ruta, carpeta de fotos].
   ============================================================ */
var CAMPOS = [
  ['Servicios Complementarios',  '/servicios-complementarios',   '/fotos-servicios-complementarios/'],
  ['Laboratorios y Talleres',    '/labor-talleres',               '/fotos-labor-talleres/'],
  ['Recreación',                 '/recreacion',                   '/fotos-recreacion/'],
  ['Repositorios',               '/repositorios',                 '/fotos-repositorios/']
];

var cont = document.getElementById('campos');
CAMPOS.forEach(function (c, i) {
  var nombre = c[0], ruta = c[1], carpeta = c[2];

  var a = document.createElement('a');
  a.className = 't campo';
  a.href = ruta;

  var cap = document.createElement('figcaption');
  cap.textContent = nombre;

  IgemaGallery.primeraFoto(carpeta).then(function (src) {
    if (src) {
      var im = document.createElement('img');
      im.src = src;
      im.alt = nombre;
      im.decoding = 'async';
      im.loading = i < 2 ? 'eager' : 'lazy';
      im.addEventListener('load', function () { im.classList.add('ok'); });
      a.insertBefore(im, cap);
    } else {
      var ph = document.createElement('div');
      ph.className = 'ph';
      a.insertBefore(ph, cap);
    }
  });

  a.appendChild(cap);
  cont.appendChild(a);
});
</script>
</body>
</html>
