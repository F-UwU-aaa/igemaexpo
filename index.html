<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igema · Cuadernos de campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:wght@900&display=swap">
<link rel="stylesheet" href="/assets/gallery.css">
<style>
  .campos{column-count:2;column-gap:28px}
  @media(min-width:700px){.campos{column-count:3}}
  .campo{display:block;text-decoration:none;color:inherit}
  .campo figcaption{font-size:30px}
</style>
</head>
<body>

<div class="r">
  <h1>Igema</h1>
  <p class="sub">Elige un campo para ver su cuaderno de fotos</p>
  <main class="campos" id="campos"></main>
</div>

<script>
/* ============================================================
   LISTA DE CAMPOS
   Para agregar uno nuevo:
     1. Crea su carpeta copiando /labo (o /ceredi) como plantilla.
     2. Sube sus fotos a /fotos_<nombre>/ en la raíz del sitio.
     3. Agrega una línea aquí: [nombre a mostrar, ruta, foto de tapa].
   ============================================================ */
var CAMPOS = [
  ['CEREDI', '/ceredi', '/fotos_ceredi/fotos_ceredi_1.jpg'],
  ['Labo',   '/labo',   '/fotos_labo/fotos_labo_1.jpg']
];

var cont = document.getElementById('campos');
CAMPOS.forEach(function (c, i) {
  var a = document.createElement('a');
  a.className = 't campo';
  a.href = c[1];

  var im = document.createElement('img');
  im.src = c[2];
  im.alt = c[0];
  im.decoding = 'async';
  im.loading = i === 0 ? 'eager' : 'lazy';
  if (i === 0) im.fetchPriority = 'high';
  im.addEventListener('load', function () { im.classList.add('ok'); });

  var cap = document.createElement('figcaption');
  cap.textContent = c[0];

  a.appendChild(im);
  a.appendChild(cap);
  cont.appendChild(a);
});
</script>
</body>
</html>
