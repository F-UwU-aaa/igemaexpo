<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de campo · CEREDI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:wght@900&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0}
  h1,p{margin:0}

  /* ---------- Hoja de cuaderno ---------- */
  .r{
    background:#F1E8D4 repeating-linear-gradient(0deg,transparent 0 31px,rgba(11,79,108,.14) 31px 32px);
    color:#1C1210;
    font-family:'Caveat',cursive;
    padding:56px 48px 80px;
    min-height:100vh;
  }
  h1{
    font:900 clamp(72px,16vw,200px)/.9 'Fraunces',serif;
    color:#8A1A1A;
    transform:rotate(-2deg);
  }
  .sub{font-size:30px;color:#0B4F6C;margin:12px 0 48px}

  /* ---------- Galería (columnas tipo mosaico) ---------- */
  .g{display:flex;gap:28px;align-items:flex-start;opacity:0;transition:opacity .5s}
  .g.listo{opacity:1}
  .col{flex:1 1 0;min-width:0}
  .t{
    margin:0 0 34px;
    background:#fff;
    padding:12px 12px 6px;
    box-shadow:0 8px 18px rgba(28,18,16,.25);
    position:relative;
    cursor:zoom-in;
    transition:transform .35s,box-shadow .35s;
    -webkit-tap-highlight-color:transparent;
  }
  .t:nth-child(odd){transform:rotate(-2.2deg)}
  .t:nth-child(even){transform:rotate(1.8deg)}
  .t:nth-child(3n){transform:rotate(-.6deg)}
  .t:hover,.t:focus-visible{
    transform:rotate(0) scale(1.07);
    z-index:3;
    box-shadow:0 22px 36px rgba(28,18,16,.35);
    outline:none;
  }
  .t:focus-visible{outline:3px solid #0B4F6C;outline-offset:4px}

  /* la foto: ocupa todo el ancho y respeta su proporción (vertical u horizontal) */
  .t img{
    display:block;
    width:100%;
    height:auto;
    background:linear-gradient(135deg,#8A1A1A,#4A0D10); /* fondo mientras carga */
    color:transparent;                                   /* oculta el alt si falla */
    aspect-ratio:3/2;                                    /* espacio provisorio mientras carga */
  }
  .t img.ok{aspect-ratio:auto}                           /* ya cargó: usa su proporción real */
  .t figcaption{
    font-size:26px;
    color:#0B4F6C;
    text-align:center;
    padding-top:4px;
  }
  @media(max-width:700px){
    .r{padding:40px 20px 60px}
    .sub{font-size:24px}
    .g{gap:18px}
    .t{margin-bottom:26px}
    .t figcaption{font-size:22px}
  }

  /* ---------- Visor (lightbox) ---------- */
  .lb{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:rgba(20,10,8,.88);
    backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;
    transition:opacity .25s,visibility .25s;
    padding:16px;
  }
  .lb.open{opacity:1;visibility:visible}

  .lb-frame{
    position:relative;
    margin:0;
    background:#fff;
    padding:14px 14px 6px;
    box-shadow:0 30px 70px rgba(0,0,0,.55);
    transform:scale(.94) rotate(-1deg);
    transition:transform .3s;
    max-width:100%;
  }
  .lb.open .lb-frame{transform:scale(1) rotate(0)}
  /* clave: la foto cabe completa en pantalla, sea vertical u horizontal */
  .lb-img{
    display:block;
    width:auto;height:auto;
    max-width:min(1100px,calc(100vw - 32px - 28px));
    max-height:calc(100vh - 32px - 20px - 52px);
    max-height:calc(100dvh - 32px - 20px - 52px);
    background:#4A0D10;
    transition:opacity .2s;
  }
  .lb-img.fade{opacity:0}
  .lb-cap{
    display:flex;justify-content:space-between;align-items:center;
    font-size:26px;color:#0B4F6C;
    padding:4px 4px 2px;
    min-height:46px;
  }
  .lb-count{font-size:22px;color:#8A1A1A}

  .lb button{
    position:absolute;
    border:0;cursor:pointer;
    font:500 34px/1 'Caveat',cursive;
    color:#F1E8D4;
    background:rgba(241,232,212,.12);
    width:52px;height:52px;border-radius:50%;
    display:grid;place-items:center;
    transition:background .2s,transform .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .lb button:hover,.lb button:focus-visible{background:#8A1A1A;transform:scale(1.08);outline:none}
  .lb-close{top:16px;right:16px}
  .lb-prev{left:16px;top:50%;margin-top:-26px}
  .lb-next{right:16px;top:50%;margin-top:-26px}

  @media(max-width:700px){
    .lb{padding:10px}
    .lb-prev,.lb-next{top:auto;bottom:14px;margin:0}
    .lb-prev{left:calc(50% - 64px)}
    .lb-next{right:calc(50% - 64px)}
    .lb-close{top:10px;right:10px;width:44px;height:44px}
    .lb-img{
      max-width:calc(100vw - 20px - 28px);
      max-height:calc(100vh - 20px - 20px - 52px - 70px);
      max-height:calc(100dvh - 20px - 20px - 52px - 70px);
    }
  }
  body.lb-lock{overflow:hidden}

  @media(prefers-reduced-motion:reduce){
    .t,.lb,.lb-frame,.lb-img{transition:none}
  }
</style>
</head>
<body>

<div class="r">
  <h1>CEREDI</h1>
  <p class="sub">Centro de exposiciones · Igema</p>

  <!-- Las fotos se cargan desde la lista FOTOS que está al final de este archivo -->
  <main class="g" id="galeria"></main>
</div>

<!-- Visor -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Visor de fotos" aria-hidden="true">
  <button class="lb-close" id="lbClose" aria-label="Cerrar">✕</button>
  <button class="lb-prev"  id="lbPrev"  aria-label="Foto anterior">‹</button>
  <button class="lb-next"  id="lbNext"  aria-label="Foto siguiente">›</button>
  <figure class="lb-frame">
    <img class="lb-img" id="lbImg" alt="">
    <figcaption class="lb-cap"><span id="lbText"></span><span class="lb-count" id="lbCount"></span></figcaption>
  </figure>
</div>

<script>
/* ============================================================
   LISTA DE FOTOS  (carpeta: fotos_ceredi/)
   Para agregar una foto nueva, añade una línea con su nombre.
   Para cambiar el pie de foto, cambia el texto después de la coma.
   ============================================================ */
var CARPETA = 'fotos_ceredi/';
var FOTOS = [
  ['fotos_ceredi_1.jpg',    'foto 01'],
  ['fotos_ceredi_2.jpg',    'foto 02'],
  ['fotos_ceredi_3.jpeg',   'foto 03'],
  ['fotos_ceredi_4.jpeg',   'foto 04'],
  ['fotos_ceredi_5.jpeg',   'foto 05'],
  ['fotos_ceredi_6.jpeg',   'foto 06'],
  ['fotos_ceredi_7.jpeg',   'foto 07'],
  ['fotos_ceredi_8.jpeg',   'foto 08'],
  ['fotos_ceredi_9.jpeg',   'foto 09'],
  ['fotos_ceredi_10.jpeg',  'foto 10'],
  ['fotos_ceredi_11.jpeg',  'foto 11'],
  ['fotos_ceredi_12.jpeg',  'foto 12'],
  ['fotos_ceredi_13.jpeg',  'foto 13'],
  ['fotos_ceredi_14.jpeg',  'foto 14'],
  ['fotos_ceredi_15.jpeg',  'foto 15'],
  ['fotos_ceredi_16.jpeg',  'foto 16'],
  ['fotos_ceredi_17.jpeg',  'foto 17'],
  ['fotos_ceredi_18.jpeg',  'foto 18'],
  ['fotos_ceredi_19.jpeg',  'foto 19']
];

(function () {
  var galeria = document.getElementById('galeria');
  var items = [];      // figuras en el orden de la lista FOTOS (el visor usa este orden)
  var ratios = [];     // alto/ancho real de cada foto
  var colsActuales = 0;

  var cargas = FOTOS.map(function (f, i) {
    var fig = document.createElement('figure');
    fig.className = 't';
    fig.tabIndex = 0;
    fig.setAttribute('role', 'button');
    fig.setAttribute('aria-label', 'Ampliar ' + f[1]);
    var im = document.createElement('img');
    im.alt = f[1];
    im.decoding = 'async';
    var cap = document.createElement('figcaption');
    cap.textContent = f[1];
    fig.appendChild(im);
    fig.appendChild(cap);
    items.push(fig);
    ratios.push(2 / 3);
    return new Promise(function (ok) {
      im.onload = function () {
        if (im.naturalWidth) ratios[i] = im.naturalHeight / im.naturalWidth;
        im.classList.add('ok');
        ok();
      };
      im.onerror = ok;
      im.src = CARPETA + f[0];
    });
  });

  function numColumnas() {
    var w = window.innerWidth;
    return w > 1000 ? 4 : w > 700 ? 3 : 2;
  }

  // reparte las fotos en columnas: cada una va a la columna más baja (queda parejo)
  function armar() {
    var n = numColumnas();
    colsActuales = n;
    galeria.innerHTML = '';
    var cols = [], altos = [];
    for (var c = 0; c < n; c++) {
      var col = document.createElement('div');
      col.className = 'col';
      galeria.appendChild(col);
      cols.push(col);
      altos.push(0);
    }
    items.forEach(function (fig, i) {
      var m = 0;
      for (var c = 1; c < n; c++) if (altos[c] < altos[m]) m = c;
      cols[m].appendChild(fig);
      altos[m] += ratios[i] + 0.3;   // 0.3 ≈ marco + pie de foto
    });
    galeria.classList.add('listo');
  }

  // esperamos a que carguen las fotos (máx. 5 s) para conocer si son verticales u horizontales
  var listo = false;
  function iniciar() { if (!listo) { listo = true; armar(); } }
  Promise.all(cargas).then(iniciar);
  setTimeout(iniciar, 5000);

  window.addEventListener('resize', function () {
    if (listo && numColumnas() !== colsActuales) armar();
  });
  var lb = document.getElementById('lb');
  var img = document.getElementById('lbImg');
  var text = document.getElementById('lbText');
  var count = document.getElementById('lbCount');
  var current = 0, lastFocus = null;

  function dataOf(i) {
    var el = items[i], im = el.querySelector('img'), cap = el.querySelector('figcaption');
    return {
      src: el.getAttribute('data-full') || im.getAttribute('data-full') || im.currentSrc || im.src,
      alt: im.alt,
      cap: cap ? cap.textContent : ''
    };
  }

  function show(i) {
    current = (i + items.length) % items.length;
    var d = dataOf(current);
    img.classList.add('fade');
    var pre = new Image();
    pre.onload = pre.onerror = function () {
      img.src = d.src;
      img.alt = d.alt;
      img.classList.remove('fade');
    };
    pre.src = d.src;
    text.textContent = d.cap;
    count.textContent = (current + 1) + ' / ' + items.length;
    // precarga vecinas para que el cambio sea instantáneo
    [current + 1, current - 1].forEach(function (n) {
      new Image().src = dataOf((n + items.length) % items.length).src;
    });
  }

  function open(i) {
    lastFocus = document.activeElement;
    show(i);
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lb-lock');
    document.getElementById('lbClose').focus();
  }

  function close() {
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lb-lock');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  items.forEach(function (el, i) {
    el.addEventListener('click', function () { open(i); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); }
    });
  });

  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); show(current - 1); });
  document.getElementById('lbNext').addEventListener('click', function (e) { e.stopPropagation(); show(current + 1); });

  // clic en el fondo oscuro cierra
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });

  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') show(current + 1);
    else if (e.key === 'ArrowLeft') show(current - 1);
  });

  // deslizar con el dedo en el celular
  var x0 = null;
  lb.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
    x0 = null;
  }, { passive: true });
})();
</script>
</body>
</html>
