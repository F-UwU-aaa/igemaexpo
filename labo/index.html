<!doctype html>
<html lang="es">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

    <figcaption class="lb-cap"><span id="lbText"></span><span class="lb-count" id="lbCount"></span></figcaption>
  </figure>

<script>
/* ============================================================

   los archivos reales que subas a /fotos_labo/.
   ============================================================ */
IgemaGallery.init({
  carpeta: '/fotos_labo/',
  fotos: [
    ['fotos_labo_1.jpg', 'foto 01'],
